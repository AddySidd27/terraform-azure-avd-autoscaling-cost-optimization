  <text x="80" y="405" class="h">Monday-Friday</text>
  <text x="230" y="405" class="small">07:00 Ramp-up</text><text x="330" y="405" class="small">→ 09:00 Peak</text><text x="420" y="405" class="small">→ 18:00 Ramp-down</text><text x="545" y="405" class="small">→ 22:00 Off-peak</text>
  <text x="80" y="449" class="h">Saturday-Sunday</text>
  <text x="230" y="449" class="small">09:00 Ramp-up</text><text x="330" y="449" class="small">→ 10:00 Peak</text><text x="420" y="449" class="small">→ 14:00 Ramp-down</text><text x="545" y="449" class="small">→ 18:00 Off-peak</text>
  <text x="80" y="486" class="small">Weekday minimum: 50% · Weekend minimum: 0% · Start VM on Connect for on-demand access</text>
  <text x="80" y="510" class="small">Capacity thresholds · schedule time zone · zero-session shutdown · maintenance exclusion tag</text>

