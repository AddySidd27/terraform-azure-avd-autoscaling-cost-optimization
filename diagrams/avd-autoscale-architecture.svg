    <style>
      .title{font:600 28px 'Segoe UI',Arial;fill:#17253d}.sub{font:15px 'Segoe UI',Arial;fill:#506070}.h{font:600 18px 'Segoe UI',Arial;fill:#17253d}.t{font:14px 'Segoe UI',Arial;fill:#26384a}.small{font:13px 'Segoe UI',Arial;fill:#506070}.box{fill:#fff;stroke:#a8b3bd;stroke-width:1.5;rx:8;filter:url(#shadow)}.azure{fill:#0078d4}.light{fill:#eef6fc;stroke:#8bbfe8;stroke-width:1.5}.flow{fill:none;stroke:#506070;stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:#0078d4;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
